<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes slideFeature {
        0%,8%   { opacity:0; transform:translateY(10px); }
        12%,20% { opacity:1; transform:translateY(0); }
        25%,100%{ opacity:0; transform:translateY(-8px); }
      }
      .f1 { animation: slideFeature 56s 0s infinite; }
      .f2 { animation: slideFeature 56s 8s infinite; }
      .f3 { animation: slideFeature 56s 16s infinite; }
      .f4 { animation: slideFeature 56s 24s infinite; }
      .f5 { animation: slideFeature 56s 32s infinite; }
      .f6 { animation: slideFeature 56s 40s infinite; }
      .f7 { animation: slideFeature 56s 48s infinite; }

      /* Counter */
      @keyframes countScore { 0%{opacity:0} 10%,90%{opacity:1} 100%{opacity:0} }
      .score-anim { animation: countScore 8s infinite; }

      /* Progress bars */
      @keyframes fillP { 0%{width:0} 40%,100%{width:var(--w)} }
      .p1 { animation: fillP1 8s infinite; --w:180px; }
      .p2 { animation: fillP2 8s infinite; --w:140px; }
      .p3 { animation: fillP3 8s infinite; --w:160px; }
      .p4 { animation: fillP4 8s infinite; --w:120px; }
      @keyframes fillP1 { 0%,5%{width:0} 40%,90%{width:180px} 100%{width:0} }
      @keyframes fillP2 { 0%,10%{width:0} 45%,90%{width:140px} 100%{width:0} }
      @keyframes fillP3 { 0%,15%{width:0} 50%,90%{width:160px} 100%{width:0} }
      @keyframes fillP4 { 0%,20%{width:0} 55%,90%{width:120px} 100%{width:0} }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" rx="16" fill="#1C1C1E"/>
  <rect x="1" y="1" width="898" height="298" rx="16" fill="none" stroke="#16A34A" stroke-width="2"/>

  <!-- Static header -->
