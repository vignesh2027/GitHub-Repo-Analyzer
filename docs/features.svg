  <text x="50" y="46" text-anchor="middle" fill="white" font-size="14" font-weight="800">R</text>
  <text x="78" y="35" fill="white" font-size="18" font-weight="800">RepoLens</text>
  <text x="78" y="53" fill="#16A34A" font-size="11" font-weight="600">GitHub Repository Intelligence</text>

  <!-- Divider -->
